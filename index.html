<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>云盘</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --line:#2a3240;
  --txt:#e6edf3; --sub:#8b949e; --acc:#4f8cff; --acc2:#3fb950; --danger:#f85149;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  font-size:14px;line-height:1.55;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}
.wrap{width:100%;max-width:1060px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:22px;
}
.mini{max-width:360px;margin:0 auto}
h1{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:.3px}
.sub{margin:0 0 18px;color:var(--sub);font-size:12.5px}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 5px}
input{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;outline:none;
  margin-bottom:12px;transition:.14s;
}
input:focus{border-color:var(--acc)}
button{
  background:var(--acc);border:1px solid var(--acc);color:#fff;
  border-radius:9px;padding:10px 16px;font:inherit;font-size:14px;
  cursor:pointer;transition:.14s;
}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:default;filter:none}
.msg{min-height:17px;font-size:12.5px;color:var(--danger);margin-top:10px}
.msg.ok{color:var(--acc2)}
.hint{margin-top:9px;font-size:11px;color:var(--sub);text-align:center}
.hide{display:none!important}

/* 配对 */
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:22px;letter-spacing:2px;text-align:center;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin:14px 0 8px;color:var(--acc);
}
/* 日志 */
.log{
  margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:11.5px;color:var(--sub);
  max-height:132px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,Menlo,monospace;
}
@media(max-width:640px){ body{padding:14px} .card{padding:18px} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 视图：登录 ===== -->
  <div class="card mini" id="vLogin">
    <h1>云盘</h1>
    <p class="sub">输入账户与密码进入</p>
    <label for="inUser">账户</label>
    <input id="inUser" autocomplete="username" placeholder="账户名">
    <label for="inPass">密码</label>
    <input id="inPass" type="password" autocomplete="current-password" placeholder="密码">
    <button id="btnLogin" style="width:100%">登 录</button>
    <div class="msg" id="loginMsg"></div>
    <div class="hint">版本 <span id="ver">-</span></div>
  </div>

  <!-- ===== 视图：授权 ===== -->
  <div class="card mini hide" id="vPair">
    <h1>授权</h1>
    <p class="sub">请使用授权码激活</p>
    <div class="code" id="devCode">----</div>
    <div class="msg" id="pairMsg"></div>
    <button id="btnCancel" style="width:100%;margin-top:8px;background:var(--card2);border-color:var(--line);color:var(--txt)">取消</button>
  </div>

  <!-- ===== 视图：主界面 ===== -->
  <div id="uiHost"></div>

  <div class="log hide" id="logBox"></div>
</div>

/* =========================================================
   基础工具
   ========================================================= */
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
function b64(buf){ let s=''; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(str){ const s=atob(str), a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; }
function hex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function log(m){
  const box=$('#logBox');
  if(!box) return;
  box.classList.remove('hide');
  box.textContent += m+'\n';
  box.scrollTop = box.scrollHeight;
}

/* =========================================================
   凭据：由 账户+密码 派生密钥解密
   ========================================================= */
let TOKEN='';
async function derive(pw, saltB64, iters, acc){
  const material=(acc||'')+'\u0000'+pw;
  const km=await crypto.subtle.importKey('raw', enc.encode(material),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:unb64(saltB64), iterations:iters, hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function aesDec(key, o){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.nonce)}, key, unb64(o.ct));
  return dec.decode(pt);
}

/* =========================================================
   设备密钥
   ========================================================= */
let keys=null, COOKIE='', DEVFP=null;
async function ensureKeys(){
  const saved=localStorage.getItem('k1');
  if(saved){
    try{
      keys=JSON.parse(saved);
      if(keys.encPriv && !keys.encPub){
        const e=await crypto.subtle.importKey('jwk',keys.encPriv,{name:'ECDH',namedCurve:'P-256'},true,[]);
        keys.encPub=b64(await crypto.subtle.exportKey('spki',e.publicKey));
      }
      if(keys.sigPriv && !keys.sigPub){
        const s=await crypto.subtle.importKey('jwk',keys.sigPriv,{name:'ECDSA',namedCurve:'P-256'},true,['sign']);
        keys.sigPub=b64(await crypto.subtle.exportKey('spki',s.publicKey));
      }
      if(keys.encPub && keys.sigPub){ localStorage.setItem('k1',JSON.stringify(keys)); return; }
    }catch(e){}
  }
  const e=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey','deriveBits']);
  const s=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  keys={
    encPriv:await crypto.subtle.exportKey('jwk',e.privateKey),
    sigPriv:await crypto.subtle.exportKey('jwk',s.privateKey),
    encPub:b64(await crypto.subtle.exportKey('spki',e.publicKey)),
    sigPub:b64(await crypto.subtle.exportKey('spki',s.publicKey))
  };
  localStorage.setItem('k1',JSON.stringify(keys));
}

/* ECIES：上行加密（用服务公钥） */
async function boxUp(obj){
  const pk=await crypto.subtle.importKey('spki',unb64(BOX_PUB),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'ECDH',public:pk},eph.privateKey,256);
  const hk=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey(
    {name:'HKDF',hash:'SHA-256',salt:enc.encode('u-01'),info:enc.encode('i-01')},
    hk,{name:'AES-GCM',length:256},false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));
  return {v:1, eph:b64(await crypto.subtle.exportKey('spki',eph.publicKey)), iv:b64(iv), ct:b64(ct)};
}
/* ECIES：下行解密（用设备私钥） */
async function boxDown(env){
  const priv=await crypto.subtle.importKey('jwk',keys.encPriv,{name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);
  const pk=await crypto.subtle.importKey('spki',unb64(env.eph),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const bits=await crypto.subtle.deriveBits({name:'ECDH',public:pk},priv,256);
  const hk=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey(
    {name:'HKDF',hash:'SHA-256',salt:enc.encode('d-01'),info:enc.encode('i-01')},
    hk,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},k,unb64(env.ct));
  return JSON.parse(dec.decode(pt));
}
async function signCmd(o){
  try{
    const k=await crypto.subtle.importKey('jwk',keys.sigPriv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
    return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,
      enc.encode(JSON.stringify({cmd:o.cmd,args:o.args,id:o.id,ts:o.ts}))));
  }catch(e){ return null; }
}

/* =========================================================
   仓库读写
   ========================================================= */
async function gh(path, opt){
  const url='https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref='+BRANCH;
  // 注意：headers 必须合并而不是覆盖，否则传 Content-Type 会把 Authorization 顶掉
  const o=Object.assign({}, opt||{});
  o.headers=Object.assign({
    Authorization:'Bearer '+TOKEN,
    Accept:'application/vnd.github+json'
  }, (opt&&opt.headers)||{});
  const r=await fetch(url,o);
  if(!r.ok){
    let why='';
    try{ why=(await r.json()).message||''; }catch(e){}
    log('✗ '+r.status+' '+why);
    if(r.status===401||r.status===403){
      log('   凭据指纹 '+tfp());
    }
    throw new Error('HTTP '+r.status+' '+why);
  }
  return r.json();
}
/* 凭据指纹：只显示首末各 6 位与长度，用于确认凭据是否正确装载 */
function tfp(){
  if(!TOKEN) return '(空)';
  return TOKEN.slice(0,6)+'…'+TOKEN.slice(-4)+' len='+TOKEN.length;
}
async function readFile(path){
  try{
    const d=await gh(path);
    if(!d || !d.content) return {content:null, sha:null};
    return {content: decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))), sha:d.sha};
  }catch(e){ return {content:null, sha:null}; }
}
async function writeFile(path, text, sha){
  const a=rndAuth();
  await gh(path, {method:'PUT', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      message:rndMsg(), content:b64(enc.encode(text)), branch:BRANCH,
      author:a, committer:a, ...(sha?{sha}:{})
    })});
}
function rndAuth(){ const n=Math.random().toString(36).slice(2,7); return {name:n,email:n+'@local'}; }
function rndMsg(){
  const a=new Uint8Array(10); crypto.getRandomValues(a);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20);
}
/* 路径混淆：必须与服务端一致 = sha256(盐+逻辑名)[:16] */
async function obf(name){
  const d=await crypto.subtle.digest('SHA-256', enc.encode(OBF_SALT+name));
  return 'cache/'+hex(d).slice(0,16)+'.dat';
}

/* =========================================================
   界面包解密
   ========================================================= */
async function openUI(acc,pw){
  const k=await derive(pw, UI_PACK.salt, UI_PACK.iters, acc);
  const pt=await aesDec(k, UI_PACK);
  return JSON.parse(pt);
}

/* =========================================================
   指令与轮询
   ========================================================= */
let PENDING=[], NAMES={}, pollTimer=null, pairTimer=null;
let stateCbs=[], resultCbs=[], readyCbs=[], READY=false;

async function cmd(name,args){
  if(!COOKIE && name!=='pair'){
    const t=$('#loginMsg');
    if(t){ t.textContent='尚未授权，请重新登录'; }
    return null;
  }
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const ts=Date.now();
  let o;
  if(BOX_PUB){
    o=Object.assign({v:2,id,ts}, await boxUp({cmd:name,args:args||{},...(COOKIE?{cookie:COOKIE}:{})}));
    const s=await signCmd(o); if(s) o.sig=s;
    log('→ '+name);
  }else{
    o={id,ts,cmd:name,args:args||{}};
    log('→ '+name+' [未加密]');
  }
  try{
    const cp=await obf('commands.jsonl');
    const cur=await readFile(cp);
    await writeFile(cp, (cur.content||'')+JSON.stringify(o)+'\n', cur.sha);
  }catch(e){
    log('✗ 发送失败 '+e.message);
    const t=$('#loginMsg')||$('#pairMsg');
    if(t && !$('#uiHost').innerHTML){ t.textContent='网络/凭据错误：'+e.message; }
    return null;
  }
  PENDING.push(id); NAMES[id]=name;
  return id;
}

async function poll(){
  if(!TOKEN) return;
  try{
    for(const id of PENDING.slice()){
      const res=await readFile(await obf('results/'+id));
      if(!res.content) continue;
      let out;
      try{
        const j=JSON.parse(res.content);
        out = (j.v===1 && keys) ? await boxDown(j) : j;
      }catch(e){ out={ok:false,msg:'解密失败'}; }
      PENDING=PENDING.filter(x=>x!==id);
      out.__cmd=NAMES[id]||'';
      log((out.ok?'✓ ':'✗ ')+(out.msg||'').slice(0,80));
      if(out.need_cookie){ clearSession(); return; }
      if(out.status) await onPair(out);
      resultCbs.forEach(f=>f(out));
      if(out.ok && !out.status && !out.data){
        setTimeout(()=>{ const h=window.__REFRESH_HOOK; h?h():cmd('list',{root:'data',path:''}); },300);
      }
    }
    const st=await readFile(await obf('state.json'));
    if(st.content){
      try{
        const j=JSON.parse(st.content);
        const d=(j.v===1&&keys) ? await boxDown(j) : j;
        stateCbs.forEach(f=>f(d));
      }catch(e){}
    }
  }catch(e){ log('轮询 '+e.message); }
}

function clearSession(){
  localStorage.removeItem('k2'); COOKIE=''; READY=false;
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(pairTimer){ clearInterval(pairTimer); pairTimer=null; }
  $('#uiHost').innerHTML='';
  $('#vPair').classList.add('hide');
  $('#vLogin').classList.remove('hide');
  const t=$('#loginMsg'); if(t){ t.className='msg'; t.textContent='会话已失效，请重新登录'; }
}

/* =========================================================
   配对
   ========================================================= */
function fmtCode(s){ const t=(s||'').replace(/-/g,'').slice(0,12).toUpperCase(); return t.match(/.{1,4}/g).join('-'); }

async function requestPair(acc,pw){
  const r=await cmd('pair',{op:'request',device_fp:DEVFP,
    device_id:navigator.userAgent.slice(0,40),
    enc_pub:keys.encPub, sig_pub:keys.sigPub,
    account:acc, password:pw});
  $('#vPair').classList.remove('hide');
  if(pairTimer) clearInterval(pairTimer);
  pairTimer=setInterval(()=>cmd('pair',{op:'status',device_fp:DEVFP}),5000);
  return r;
}

async function onPair(res){
  if(res.status==='active' && res.cookie_env){
    try{
      COOKIE=(await boxDown(res.cookie_env)).cookie;
      localStorage.setItem('k2',COOKIE);
      if(pairTimer){ clearInterval(pairTimer); pairTimer=null; }
      $('#vPair').classList.add('hide');
      log('已授权');
      READY=true; readyCbs.forEach(f=>f());
      return;
    }catch(e){ log('凭据处理失败'); }
  }
  if(res.code) $('#devCode').textContent=fmtCode(res.code);
  if(res.status==='pending') $('#pairMsg').textContent='等待确认（每 5 秒自动查询）';
  if(res.status==='revoked'){
    $('#pairMsg').textContent='该设备已被吊销';
    if(pairTimer){ clearInterval(pairTimer); pairTimer=null; }
  }
}

/* =========================================================
   界面注入
   ========================================================= */
function injectUI(pack){
  const host=$('#uiHost');
  if(pack.css){
    const st=document.createElement('style');
    st.textContent=pack.css;
    document.head.appendChild(st);
  }
  host.innerHTML=pack.html||'';
  if(pack.js){
    const sc=document.createElement('script');
    sc.textContent=pack.js;
    document.body.appendChild(sc);
  }
}

/* =========================================================
   登录
   ========================================================= */
async function doLogin(){
  const acc=$('#inUser').value.trim(), pw=$('#inPass').value;
  const msg=$('#loginMsg');
  msg.className='msg'; msg.textContent='';
  if(!acc){ msg.textContent='请输入账户'; return; }
  if(!pw){ msg.textContent='请输入密码'; return; }
  $('#btnLogin').disabled=true; msg.textContent='正在校验';

  try{
    const k=await derive(pw, TOKEN_ENV.salt, TOKEN_ENV.iters, acc);
    const raw=await aesDec(k, TOKEN_ENV);
    // 明文是 {"t":"<token>"}，必须取出字段，整串当 token 会 401
    try{ TOKEN=(JSON.parse(raw).t)||''; }catch(e){ TOKEN=raw; }
  }catch(e){}
  if(!TOKEN){
    $('#btnLogin').disabled=false;
    msg.textContent='账户或密码错误';
    return;
  }
  log('凭据就绪 '+tfp());

  let pack;
  try{ pack=await openUI(acc,pw); }
  catch(e){
    $('#btnLogin').disabled=false;
    msg.textContent='资源解密失败';
    return;
  }

  await ensureKeys();
  DEVFP=hex(await crypto.subtle.digest('SHA-256',unb64(keys.sigPub))).slice(0,32);
  localStorage.setItem('k3',acc);
  COOKIE=localStorage.getItem('k2')||'';
  $('#vLogin').classList.add('hide');

  if(!COOKIE){
    await requestPair(acc,pw);
    if(pollTimer) clearInterval(pollTimer);
    pollTimer=setInterval(poll,3000);
    poll();
    // 授权后注入界面
    const wait=setInterval(()=>{
      if(READY){ clearInterval(wait); injectUI(pack); }
    },400);
  }else{
    injectUI(pack);
    if(pollTimer) clearInterval(pollTimer);
    pollTimer=setInterval(poll,3000);
    poll();
  }
  $('#btnLogin').disabled=false;
}

/* =========================================================
   对外接口（供主界面调用）
   ========================================================= */
window.APP={
  cmd,
  log,
  onState:f=>stateCbs.push(f),
  onResult:f=>resultCbs.push(f),
  onReady:f=>{ READY?f():readyCbs.push(f); },
  uploadToInbox:async function(file){
    const buf=await file.arrayBuffer();
    await writeFile('u/'+file.name, b64(buf), null);
    return {ok:true};
  },
  changePassword:()=>{}
};

/* =========================================================
   启动
   ========================================================= */
(function boot(){
  $('#ver').textContent=VER;
  $('#btnLogin').onclick=doLogin;
  $('#btnCancel').onclick=()=>{ $('#vPair').classList.add('hide'); $('#vLogin').classList.remove('hide'); };
  ['#inUser','#inPass'].forEach(s=>{
    const el=$(s);
    if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  });
  const saved=localStorage.getItem('k3');
  if(saved) $('#inUser').value=saved;
})();
</script>
